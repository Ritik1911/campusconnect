<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CampusConnect — Login</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body class="auth-page">

  <div class="auth-bg">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
  </div>

  <div class="auth-container">
    <div class="auth-brand">
      <div class="brand-icon">🎓</div>
      <h1>CampusConnect</h1>
      <p>Connect with students across your campus</p>
    </div>

    <div class="auth-card">
      <div class="auth-tabs">
        <button class="tab-btn" onclick="showTab('login')">Login</button>
        <button class="tab-btn active" onclick="showTab('register')">Register</button>
      </div>

      <!-- LOGIN -->
      <div id="login-tab" class="tab-content">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="login-username" placeholder="Enter your username"/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Enter your password"/>
        </div>
        <div id="login-error" class="error-msg"></div>
        <button class="btn-primary" id="login-btn" onclick="loginUser()">Login →</button>
        <p class="switch-text">Don't have an account? <a onclick="showTab('register')">Register here</a></p>
      </div>

      <!-- REGISTER -->
      <div id="register-tab" class="tab-content active">
        <div class="form-row">
          <div class="form-group">
            <label>Username *</label>
            <input type="text" id="reg-username" placeholder="Choose a username"/>
          </div>
          <div class="form-group">
            <label>Full Name *</label>
            <input type="text" id="reg-fullname" placeholder="Your full name"/>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Mobile Number *</label>
            <input type="tel" id="reg-mobile" placeholder="10-digit number" maxlength="10"/>
          </div>
          <div class="form-group">
            <label>Email ID *</label>
            <input type="email" id="reg-email" placeholder="your@email.com"/>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Stream *</label>
            <select id="reg-stream">
              <option value="">Select Stream</option>
              <option>B.Tech - CS</option>
              <option>B.Tech - CS - AI</option>
              <option>B.Tech - IT</option>
              <option>B.Tech - EC</option>
              <option>B.Tech - ME</option>
              <option>B.Tech - Civil</option>
              <option>BCA</option>
              <option>MCA</option>
              <option>MBA</option>
              <option>B.Com</option>
              <option>B.Sc</option>
              <option>Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Year *</label>
            <select id="reg-year">
              <option value="">Select Year</option>
              <option>1st Year</option>
              <option>2nd Year</option>
              <option>3rd Year</option>
              <option>4th Year</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Semester *</label>
            <select id="reg-semester">
              <option value="">Select Semester</option>
              <option>Sem 1</option><option>Sem 2</option><option>Sem 3</option>
              <option>Sem 4</option><option>Sem 5</option><option>Sem 6</option>
              <option>Sem 7</option><option>Sem 8</option>
            </select>
          </div>
          <div class="form-group">
            <label>Building *</label>
            <input type="text" id="reg-building" placeholder="e.g. Block A, SOCSET"/>
          </div>
        </div>
        <div class="form-group">
          <label>Location / Area *</label>
          <input type="text" id="reg-location" placeholder="e.g. Vadodara, Surat"/>
        </div>
        <div class="form-group">
          <label>Password *</label>
          <input type="password" id="reg-password" placeholder="Minimum 6 characters"/>
        </div>
        <div id="reg-error" class="error-msg"></div>
        <button class="btn-primary" id="reg-btn" onclick="registerUser()">Create Account →</button>
        <p class="switch-text">Already have an account? <a onclick="showTab('login')">Login here</a></p>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
