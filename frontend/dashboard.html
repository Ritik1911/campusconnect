<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CampusConnect — Dashboard</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">🎓 CampusConnect</div>
    <div class="nav-links">
      <a href="dashboard.html" class="nav-link active">🏠 Dashboard</a>
      <a href="post.html" class="nav-link">✏️ Post</a>
      <button class="nav-saved-btn" onclick="showSavedPosts()">⭐ Saved</button>
      <button class="nav-saved-btn" onclick="toggleReadSection()">✅ Read</button>
      <button class="nav-notif-btn" onclick="showNotifications()" title="Notifications">
        🔔 Notifications<span class="notif-badge" id="notif-count" style="display:none;"></span>
      </button>
      <a href="admin.html" class="nav-link">🛡️ Admin</a>
    </div>
    <div class="nav-user">
      <a href="profile.html" class="profile-nav-link" id="nav-username"></a>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="app-container">

    <div class="welcome-banner">
      <div>
        <h2 id="welcome-text">Welcome! 👋</h2>
        <p id="welcome-sub">What's happening on campus today?</p>
      </div>
      <div style="display:flex;gap:10px;align-items:center;">
        <a href="profile.html" class="btn-profile-link">👤 My Profile</a>
        <a href="post.html" class="btn-post-now">+ Create Post</a>
      </div>
    </div>

    <div class="section-title">📂 Filter by Topic</div>
    <div class="topic-chips">
      <button class="chip active" onclick="filterPosts('all', this)">🌐 All <span class="chip-count" id="count-all"></span></button>
      <button class="chip" onclick="filterPosts('Sincere Work', this)">📚 Sincere Work <span class="chip-count" id="count-sincere"></span></button>
      <button class="chip" onclick="filterPosts('Fun Work', this)">🎮 Fun Work <span class="chip-count" id="count-fun"></span></button>
      <button class="chip" onclick="filterPosts('Get Together', this)">🤝 Get Together <span class="chip-count" id="count-gettogether"></span></button>
      <button class="chip" onclick="filterPosts('Party', this)">🎉 Party <span class="chip-count" id="count-party"></span></button>
      <button class="chip" onclick="filterPosts('Earning', this)">💰 Earning <span class="chip-count" id="count-earning"></span></button>
      <button class="chip" onclick="filterPosts('Help', this)">🆘 Help <span class="chip-count" id="count-help"></span></button>
      <button class="chip" onclick="filterPosts('Learn', this)">🧠 Learn <span class="chip-count" id="count-learn"></span></button>
      <button class="chip" onclick="filterPosts('Assignment', this)">📝 Assignment <span class="chip-count" id="count-assignment"></span></button>
      <button class="chip" onclick="filterPosts('Exam', this)">📊 Exam <span class="chip-count" id="count-exam"></span></button>
      <button class="chip" onclick="filterPosts('Other', this)">💬 Other <span class="chip-count" id="count-other"></span></button>
    </div>

    <div class="section-title">💡 Suggestions For You</div>
    <div id="suggestions-box" class="suggestions-grid"></div>

    <!-- ANNOUNCEMENTS SECTION -->
    <div id="announcements-section" style="display:none;">
      <div class="section-title">📢 Announcements</div>
      <div id="announcements-feed" style="margin-bottom:24px;"></div>
    </div>

    <!-- READ POSTS SECTION (hidden by default) -->
    <div id="read-section" style="display:none;">
      <div class="section-title" style="display:flex;align-items:center;justify-content:space-between;">
        <span>✅ Posts You've Read</span>
        <button onclick="toggleReadSection()" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:0.85rem;">✕ Hide</button>
      </div>
      <div id="read-posts-feed" class="posts-feed" style="margin-bottom:24px;"></div>
    </div>

    <div class="section-title">📰 Latest Posts</div>
    <div id="posts-feed" class="posts-feed">
      <div class="empty-state">Loading posts...</div>
    </div>
  </div>

  <!-- Scroll Buttons -->
  <div class="scroll-btns">
    <button class="scroll-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
    </button>
    <button class="scroll-btn" onclick="window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </button>
  </div>

  <!-- Saved Posts Modal -->
  <div id="saved-modal" class="modal-overlay" style="display:none;" onclick="if(event.target===this)this.style.display='none'">
    <div class="modal-card" style="max-width:700px;width:95%;max-height:85vh;overflow-y:auto;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h3>⭐ Saved Posts</h3>
        <button class="btn-logout" onclick="document.getElementById('saved-modal').style.display='none'">✕ Close</button>
      </div>
      <div id="saved-list"></div>
    </div>
  </div>

  <!-- Comment Modal -->
  <div id="comment-modal" class="modal-overlay" style="display:none;" onclick="if(event.target===this)closeCommentModal()">
    <div class="modal-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3>💬 Comments</h3>
        <button class="btn-logout" onclick="closeCommentModal()">✕</button>
      </div>
      <div id="comments-list" style="max-height:280px;overflow-y:auto;margin-bottom:14px;"></div>
      <textarea id="comment-input" rows="2" placeholder="Write a comment..." style="width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);resize:none;font-family:inherit;"></textarea>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;">
        <button class="btn-primary" style="padding:8px 20px;" onclick="submitComment()">Post Comment</button>
      </div>
    </div>
  </div>

  <script src="js/dashboard.js"></script>
</body>
</html>
